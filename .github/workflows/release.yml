name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version, tag and changelog
        id: meta
        run: |
          set -euo pipefail
          version="$(grep -m1 '^mod_version=' gradle.properties | cut -d= -f2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Topmost section of CHANGELOG.md (same logic as getLatestChangelog in build.gradle)
          awk '/^## /{if (seen) exit; seen=1} seen' CHANGELOG.md > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Build
        run: ./gradlew build :fabric:modernRemapJar --no-daemon -PcurseforgeApiToken= -PmodrinthApiToken=

      - name: Collect e4droid assets
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          mkdir -p dist
          for platform in fabric forge neoforge; do
            src="$(ls "$platform"/build/libs/e4mc-"$platform"-"$version".jar 2>/dev/null \
              || ls "$platform"/build/libs/e4mc-"$platform"-*.jar \
                 | grep -v -E -- '-sources|-dev-shadow|-dev\.|-modern|-unstubbed' | head -n1)"
            cp "$src" "dist/e4droid-$platform-$version.jar"
          done
          # Sources jars (nice to have)
          for platform in fabric forge neoforge; do
            src="$(ls "$platform"/build/libs/e4mc-"$platform"-"$version"-sources.jar 2>/dev/null || true)"
            if [[ -n "$src" ]]; then
              cp "$src" "dist/e4droid-$platform-$version-sources.jar"
            fi
          done
          ls -l dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading assets."
            gh release upload "$tag" dist/*.jar --clobber
          else
            gh release create "$tag" dist/*.jar \
              --title "$tag" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi
